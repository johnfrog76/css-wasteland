<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Not in search yet, deliberately. The first deploy is a soft launch: the
         allowlist, the copy, and the OG/preview metadata all want a pass before
         strangers arrive via Google. Removing this one line is the whole opt-in.
         noindex WITHOUT a robots.txt Disallow is intentional — Disallow blocks the
         crawl, so the crawler never reads this tag, and a linked-to URL can still
         surface as a bare result. Letting bots fetch and see "noindex" is what
         actually keeps the site out of the index. -->
    <meta name="robots" content="noindex" />
    <title>The CSS Wasteland</title>

    <!-- Link previews (iMessage, Teams, Slack, WhatsApp). Independent of the
         noindex above: that keeps the site out of SEARCH, these control how a
         PASTED LINK renders. A soft launch still wants shared links to look
         like something.

         One card for the whole site, deliberately. Preview crawlers don't run
         JavaScript — they read this static HTML and stop — so per-deck cards
         would need pre-rendered HTML per route. Not worth a build step for it.

         og:image must be ABSOLUTE (crawlers don't resolve relative paths), so
         it's built from https://css-wasteland.com + /, both substituted at build
         time. Hardcoding the project-page URL would silently break the card
         the day the apex domain goes live. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The CSS Wasteland" />
    <meta property="og:title" content="The CSS Wasteland" />
    <meta
      property="og:description"
      content="A blog about technology and engineering culture — written as slide decks, animated entirely in CSS."
    />
    <meta property="og:url" content="https://css-wasteland.com/" />
    <meta property="og:image" content="https://css-wasteland.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A night skyline of labelled towers — Chrome, Scenes, Deck, Motion, Renderer — under a dashed arc of stars."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The CSS Wasteland" />
    <meta
      name="twitter:description"
      content="A blog about technology and engineering culture — written as slide decks, animated entirely in CSS."
    />
    <meta name="twitter:image" content="https://css-wasteland.com/og.png" />

    <!-- GA4. Stripped entirely from dev builds — the whole block is replaced
         with a comment unless this is a production build (see vite.config.ts),
         so local work never reaches the property and there's no script to load
         while developing.

         send_page_view is FALSE on purpose: this is a BrowserRouter SPA, so
         GA's automatic page view would fire once and then never again. Views
         are sent per route change by PageViewTracker instead. Leaving the
         default on would double-count the first page of every session. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RYXYC7GQLG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-RYXYC7GQLG', { send_page_view: false });
    </script>
    <script type="module" crossorigin src="/assets/index-BeoibEeN.js"></script>
  </head>
  <body style="margin: 0; padding: 0">
    <div id="root"></div>
  </body>
</html>
