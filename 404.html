<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>The CSS Wasteland</title>
    <script>
      // GitHub Pages serves this file for any path that isn't a real file on
      // disk. The app uses BrowserRouter so its URLs stay real
      // (/decks/museum-of-bugs, not /#/decks/museum-of-bugs), and Pages has no
      // rewrite rule to hand those back to the SPA -- so every deep link lands
      // here first. This is the standard shim that sends it onward.
      //
      // The requested path is stashed in sessionStorage and replayed by
      // index.html once React has booted, so a shared deck link opens THAT
      // deck rather than dumping the visitor on the home wall. Sharing links
      // is most of what this site is for; landing them somewhere else is a
      // worse failure than the small amount of machinery here.
      //
      // /css-wasteland/ is substituted at build time (see vite.config.ts) and can't
      // be derived at runtime: on an apex domain "/decks" is a route, on a
      // project page it's a prefix, and the URL alone can't tell you which.
      var base = "/css-wasteland/";
      var path = location.pathname;
      // Everything after the app root -- the route the visitor actually asked
      // for. Guard against a path that somehow doesn't start with base.
      var route = path.indexOf(base) === 0 ? path.slice(base.length) : "";
      try {
        sessionStorage.setItem("wasteland:redirect", route + location.search + location.hash);
      } catch (e) {
        // Private mode / storage disabled: fall through and land on home.
        // Degraded, not broken.
      }
      // replace(), not assign(): this URL must not enter history, or Back
      // would bounce the visitor straight through it again.
      location.replace(base);
    </script>
  </head>
  <body>
    <!-- Only visible with JS off, in which case no redirect can happen. -->
    <p>Not found. <a href="./">Go to the CSS Wasteland</a>.</p>
  </body>
</html>
